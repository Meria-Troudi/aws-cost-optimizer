# ============================================================
# AWS COST OPTIMIZER
# RESOURCE CATALOG
#
# The catalog maps:
#
#   AWS billing service + usage type
#              ↓
#        resource type
#              ↓
#          collector
#
# domain/subdomain are organizational metadata.
# They do NOT control execution.
#
# Execution is determined by the planner.
# ============================================================


# ============================================================
# NETWORK / VPC
# ============================================================

nat_gateway:

  domain: network
  subdomain: vpc

  billing:
    services:
      - EC2 - Other
      - Amazon Virtual Private Cloud

    usage_patterns:
      - "*NatGateway*"

    # EC2 - Other is also billed by ebs_volume (EBS), so this
    # is no longer a unique claim -- fallback only fires when
    # exactly one enabled entry claims the service, so it stays
    # inert (and unmatched usage stays unmatched) whenever both
    # entries are enabled.
    service_fallback: true

  collector:
    key: nat_gateway
    resource_type: nat_gateway

  rules:
    enabled: true


public_ipv4:

  domain: network
  subdomain: vpc

  billing:
    services:
      - Amazon Virtual Private Cloud

    usage_patterns:
      - "*PublicIPv4*"
      - "*PublicIpv4*"

    # VPC billing is shared by multiple resource types.
    # Never guess from the service alone.
    service_fallback: false

  collector:
    key: public_ipv4
    resource_type: public_ipv4

  rules:
    enabled: true


vpc_endpoint:

  domain: network
  subdomain: vpc

  billing:
    services:
      - Amazon Virtual Private Cloud

    usage_patterns:
      - "*VpcEndpoint*"
      - "*VPCEndpoint*"
      - "*Vpcendpoint*"

    service_fallback: false

  collector:
    key: vpc_endpoint
    resource_type: vpc_endpoint

  rules:
    enabled: true


transit_gateway:

  domain: network
  subdomain: vpc

  billing:
    services:
      - Amazon Virtual Private Cloud

    usage_patterns:
      - "*TransitGateway*"

    service_fallback: false

  collector:
    key: transit_gateway
    resource_type: transit_gateway

  rules:
    enabled: true


