# aws_cost_optimizer/planner/resource_catalog.yaml
nat_gateway:
  category: ec2_other
  billing:
    services:
      - EC2 - Other
      - Amazon Virtual Private Cloud
    usage_patterns:
      - "*NatGateway*"
  collector:
    key: nat_gateway
    resource_type: nat_gateway
public_ipv4:
  category: ec2_other
  billing:
    services:
      - Amazon Virtual Private Cloud
    usage_patterns:
      - "*PublicIPv4*"
  collector:
    key: public_ipv4
    resource_type: public_ipv4
transit_gateway:
  category: ec2_other
  billing:
    services:
      - Amazon Virtual Private Cloud
    usage_patterns:
      - "*TransitGateway*"
  collector:
    key: transit_gateway
    resource_type: transit_gateway
vpc_endpoint:
  category: ec2_other
  billing:
    services:
      - Amazon Virtual Private Cloud
    usage_patterns:
      - "*VpcEndpoint*"
      - "*VPCEndpoint*"
  collector:
    key: vpc_endpoint
    resource_type: vpc_endpoint


rds_instance:
  category: database
  billing:
    services:
      - Amazon Relational Database Service
    usage_patterns:
      - "*InstanceUsage*"
      - "*RDS:ChargedBackupUsage*"
      - "*RDS*"
  collector:
    key: rds
    resource_type: rds_instance

# EKS
eks_cluster:
  category: compute
  billing:
    services:
      - Amazon Elastic Container Service for Kubernetes
    usage_patterns:
      - "*AmazonEKS*"
      - "*EKS*"
  collector:
    key: eks
    resource_type: eks_cluster

# ELB / LOAD BALANCER
load_balancer:
  category: network
  billing:
    services:
      - Amazon Elastic Load Balancing
    usage_patterns:
      - "*LoadBalancer*"
      - "*ELB*"
  collector:
    key: elb
    resource_type: load_balancer

# VPC / NETWORKING - FUTURE
vpc_peering:
  category: ec2_other
  billing:
    services:
      - Amazon Virtual Private Cloud
    usage_patterns:
      - "*VpcPeering*"
      - "*VPCPeering*"
  collector:
    key: vpc_peering
    resource_type: vpc_peering
carrier_gateway:
  category: ec2_other
  billing:
    services:
      - Amazon Virtual Private Cloud
    usage_patterns:
      - "*CarrierGateway*"
  collector:
    key: carrier_gateway
    resource_type: carrier_gateway
