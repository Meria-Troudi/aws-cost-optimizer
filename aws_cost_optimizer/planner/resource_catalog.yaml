# ============================================================
# ANALYTICS / QUICKSIGHT
# ============================================================

quicksight:

  domain: analytics
  subdomain: quicksight

  billing:
    services:
      - Amazon QuickSight

    usage_patterns:
      - "*QuickSight*"
      - "*QS*"
      - "*Reader*"
      - "*QuickSuite*"

    service_fallback: true

  collector:
    key: quicksight
    resource_type: quicksight

  rules:
    enabled: true


# ============================================================
# STORAGE / EBS
# ============================================================

ebs_volume:

  domain: storage
  subdomain: null

  billing:
    services:
      - EC2 - Other

    usage_patterns:
      - "*EBS:VolumeUsage*"

    # EC2 - Other is shared with nat_gateway; a distinct usage
    # pattern is matched first, so fallback is never needed here.
    service_fallback: false

  collector:
    key: ebs
    resource_type: ebs_volume

  rules:
    enabled: true

# ============================================================
# SECURITY / AWS WAF
# ============================================================
aurora_cluster:

  domain: database
  subdomain: null

  billing:
    services:
      - Amazon Relational Database Service

    usage_patterns:
      - "*Aurora*"
      - "*Serverless*"

    service_fallback: false

  collector:
    key: aurora_cluster
    resource_type: aurora_cluster

  rules:
    enabled: true
waf_web_acl:

  domain: security
  subdomain: null

  billing:
    services:
      - AWS WAF
      - AWS WAFV2

    usage_patterns:
      - "*WAF*"
      - "*WebACL*"
      - "*WebAcl*"
      - "*Request*"
      - "*Captcha*"
      - "*Challenge*"
      - "*BotControl*"
      - "*FraudControl*"

    # AWS WAF is currently the only enabled catalog entry claiming
    # the AWS WAF service in this project.
    service_fallback: true

  collector:
    key: waf
    resource_type: waf_web_acl

  rules:
    enabled: true