# ============================================================
# DATABASE / RDS
# ============================================================

rds_instance:

  domain: database
  subdomain: null

  billing:
    services:
      - Amazon Relational Database Service

    usage_patterns:
      - "*InstanceUsage*"
      - "*RDS:ChargedBackupUsage*"
      - "*RDS*"

    # RDS is currently uniquely represented by this
    # catalog entry.
    service_fallback: true

  collector:
    key: rds
    resource_type: rds_instance

  rules:
    enabled: true


dynamodb_table:

  domain: database
  subdomain: null

  billing:
    services:
      - Amazon DynamoDB

    usage_patterns:
      - "*ReadCapacityUnit*"
      - "*WriteCapacityUnit*"
      - "*PayPerRequestThroughput*"
      - "*CommittedThroughput*"

    # "Amazon DynamoDB" also carries storage/stream/backup usage
    # types under some account billing layouts -- never guess from
    # the service alone.
    service_fallback: false

  collector:
    key: dynamodb
    resource_type: dynamodb_table

  rules:
    enabled: true


# ============================================================
# COMPUTE / EC2
# ============================================================

ec2_instance:

  domain: compute
  subdomain: null

  billing:
    services:
      - Amazon Elastic Compute Cloud - Compute

    usage_patterns:
      - "*BoxUsage*"
      - "*SpotUsage*"

    # "Amazon Elastic Compute Cloud - Compute" also carries EBS/other
    # usage types under some account billing layouts -- never guess
    # from the service alone.
    service_fallback: false

  collector:
    key: ec2
    resource_type: ec2_instance

  rules:
    enabled: true


