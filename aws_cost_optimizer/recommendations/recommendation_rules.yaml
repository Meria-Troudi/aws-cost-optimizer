# =============================================================================
# AWS COST OPTIMIZATION RECOMMENDATION CATALOG
# =============================================================================
#
# The catalog defines recommendation intent and safety constraints.
# Human-readable explanation is generated from the finding evidence by the LLM.
#
# The catalog does NOT contain long prose templates, savings claims,
# replacement resource types, or hard-coded remediation commands.
# =============================================================================

recommendations:

  review_unused:
    family: unused_resource
    action: review_unused
    priority: high
    recommendation_eligible: true
    required_evidence:
      - observed_usage
      - resource_state
      - dependencies
    never_invent:
      - savings
      - replacement_resource
      - deletion_safety

  review_rightsizing:
    family: rightsizing
    action: review_capacity
    priority: high
    recommendation_eligible: true
    required_evidence:
      - utilization
      - peak_behavior
      - current_capacity
    never_invent:
      - replacement_size
      - savings
      - exact_capacity_to_remove

  review_capacity:
    family: capacity
    action: review_capacity_configuration
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - configured_capacity
      - observed_demand
      - performance_signals
    never_invent:
      - replacement_capacity
      - savings

  review_autoscaling:
    family: autoscaling
    action: review_dynamic_capacity
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - demand_pattern
      - configured_capacity
      - autoscaling_state
    never_invent:
      - scaling_policy
      - min_capacity
      - max_capacity
      - savings

  review_billing_mode:
    family: billing_mode
    action: compare_pricing_models
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - billing_mode
      - workload_pattern
      - capacity_usage
    never_invent:
      - cheaper_mode
      - savings
      - target_capacity

  review_replica:
    family: replica_optimization
    action: review_replica_usage
    priority: high
    recommendation_eligible: true
    required_evidence:
      - replica_usage
      - read_traffic
      - failover_context
    never_invent:
      - replica_to_delete
      - savings

  review_global_replication:
    family: replication
    action: review_replica_regions
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - replica_regions
      - regional_usage
      - replication_configuration
    never_invent:
      - region_to_remove
      - savings

  review_serverless:
    family: serverless
    action: review_serverless_suitability
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - workload_variability
      - current_capacity
      - performance
    never_invent:
      - serverless_migration
      - target_capacity
      - savings

  review_scheduling:
    family: scheduling
    action: review_operating_schedule
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - activity_pattern
      - resource_status
      - observation_window
    never_invent:
      - shutdown_schedule
      - business_hours
      - savings

  review_storage:
    family: storage
    action: review_storage_configuration
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - storage_usage
      - growth
      - performance
      - retention
    never_invent:
      - target_storage_type
      - target_size
      - savings

  review_network:
    family: network
    action: review_network_architecture
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - traffic
      - topology
      - routing
      - dependencies
    never_invent:
      - route_change
      - resource_deletion
      - savings

  review_network_path:
    family: network_path
    action: review_traffic_path
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - traffic
      - source
      - destination
      - topology
    never_invent:
      - replacement_path
      - savings

  review_backup:
    family: backup
    action: review_retention
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - retention
      - backup_usage
      - recovery_requirements
    never_invent:
      - retention_target
      - compliance_requirement
      - savings

  review_pricing:
    family: commitment
    action: review_commitment
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - usage_stability
      - eligible_usage
      - existing_commitments
    never_invent:
      - commitment_amount
      - savings

  review_architecture:
    family: architecture
    action: review_architecture
    priority: medium
    recommendation_eligible: true
    required_evidence:
      - traffic
      - workload_pattern
      - current_architecture
    never_invent:
      - architecture_replacement
      - savings

  review_configuration:
    family: configuration
    action: review_configuration
    priority: low
    recommendation_eligible: true
    required_evidence:
      - configuration
      - observed_behavior
    never_invent:
      - required_configuration
      - savings


# =============================================================================
# ROUTES
# =============================================================================

routes:

  # ---------------------------------------------------------------------------
  # RDS
  # ---------------------------------------------------------------------------

  rds_stopped_instance:
    recommendation_key: review_unused

  rds_no_activity:
    recommendation_key: review_unused

  rds_instance_possible_oversized:
    recommendation_key: review_rightsizing

  rds_underused_read_replica:
    recommendation_key: review_replica


  # ---------------------------------------------------------------------------
  # AURORA
  # ---------------------------------------------------------------------------
  #
  # Use these exact route names when the Aurora analyzer is implemented.
  # Keep the catalog independent of long explanatory prose.

  aurora_provisioned_underutilized:
    recommendation_key: review_rightsizing

  aurora_serverless_suitability:
    recommendation_key: review_serverless

  aurora_reader_underutilized:
    recommendation_key: review_replica

  aurora_reader_scaling_review:
    recommendation_key: review_autoscaling

  aurora_global_database_review:
    recommendation_key: review_global_replication

  aurora_backup_retention_review:
    recommendation_key: review_backup


  # ---------------------------------------------------------------------------
  # EKS
  # ---------------------------------------------------------------------------

  eks_low_worker_utilization:
    recommendation_key: review_rightsizing

  eks_nodegroup_underutilization:
    recommendation_key: review_rightsizing

  eks_minimum_capacity_review:
    recommendation_key: review_capacity

  eks_pod_cpu_request_overprovisioning:
    recommendation_key: review_rightsizing

  eks_pod_memory_request_overprovisioning:
    recommendation_key: review_rightsizing

  eks_gpu_underutilization:
    recommendation_key: review_rightsizing

  eks_no_observed_worker_capacity:
    recommendation_key: review_unused


  # Extended-support pricing is a cost signal, but the actual upgrade
  # target must come from current AWS compatibility/pricing data.
  eks_extended_support_review:
    recommendation_key: review_configuration


  # ---------------------------------------------------------------------------
  # ELB
  # ---------------------------------------------------------------------------

  elb_no_observed_activity:
    recommendation_key: review_unused

  elb_low_traffic:
    recommendation_key: review_rightsizing

  elb_no_registered_targets:
    recommendation_key: review_unused

  elb_idle_target_group:
    recommendation_key: review_unused

  elb_no_healthy_targets_no_traffic:
    recommendation_key: review_unused

  elb_idle_with_cost:
    recommendation_key: review_unused


  # ---------------------------------------------------------------------------
  # TRANSIT GATEWAY
  # ---------------------------------------------------------------------------

  transit_gateway_no_observed_traffic:
    recommendation_key: review_network

  transit_gateway_high_traffic:
    recommendation_key: review_network_path

  transit_gateway_unrouted_attachment:
    recommendation_key: review_configuration

  transit_gateway_unassociated_attachment:
    recommendation_key: review_configuration

  transit_gateway_blackhole_routes:
    recommendation_key: review_configuration

  transit_gateway_vpc_blackhole_routes:
    recommendation_key: review_configuration


  # ---------------------------------------------------------------------------
  # VPC ENDPOINT
  # ---------------------------------------------------------------------------
  #
  # These are operational diagnostics in your current analyzer.
  # They should remain recommendation_eligible=False there.
  #
  # Therefore they intentionally have NO recommendation route:
  #
  # vpc_endpoint_non_operational
  # vpc_endpoint_gateway_missing_route
  # vpc_endpoint_gateway_partial_route_coverage
  # vpc_endpoint_interface_eni_mismatch


  # ---------------------------------------------------------------------------
  # DYNAMODB
  # ---------------------------------------------------------------------------

  dynamodb_provisioned_capacity_underutilized:
    recommendation_key: review_rightsizing

  dynamodb_provisioned_autoscaling_review:
    recommendation_key: review_autoscaling

  dynamodb_no_observed_activity:
    recommendation_key: review_unused

  dynamodb_on_demand_billing_mode_review:
    recommendation_key: review_billing_mode

  dynamodb_global_table_replica_review:
    recommendation_key: review_global_replication

  dynamodb_gsi_underutilized:
    recommendation_key: review_capacity

  # Operational only.
  # Keep recommendation_eligible=False in the analyzer.
  #
  # dynamodb_throttling_observed


  # ---------------------------------------------------------------------------
  # NAT GATEWAY
  # ---------------------------------------------------------------------------

  nat_gateway_idle:
    recommendation_key: review_network

  nat_gateway_low_traffic:
    recommendation_key: review_network

  nat_gateway_no_route_dependency:
    recommendation_key: review_unused

  nat_gateway_cross_az:
    recommendation_key: review_network_path

  nat_gateway_endpoint_opportunity:
    recommendation_key: review_network_path

  nat_gateway_high_data_processing:
    recommendation_key: review_network_path

  nat_gateway_multiple_az:
    recommendation_key: review_network


  # ---------------------------------------------------------------------------
  # EBS
  # ---------------------------------------------------------------------------

  unattached_ebs_volume:
    recommendation_key: review_unused

  ebs_gp2_to_gp3:
    recommendation_key: review_storage

  ebs_low_iops_utilization:
    recommendation_key: review_storage

  ebs_low_throughput_utilization:
    recommendation_key: review_storage


  # ---------------------------------------------------------------------------
  # EC2
  # ---------------------------------------------------------------------------

  ec2_idle_instance:
    recommendation_key: review_unused

  ec2_instance_underutilized:
    recommendation_key: review_rightsizing

  ec2_capacity_pressure:
    recommendation_key: review_capacity

  ec2_old_generation:
    recommendation_key: review_rightsizing

  ec2_spot_candidate:
    recommendation_key: review_pricing

  ec2_stable_long_running:
    recommendation_key: review_pricing

  ec2_autoscaling_opportunity:
    recommendation_key: review_autoscaling

  ec2_nonproduction_scheduling:
    recommendation_key: review_scheduling


  # ---------------------------------------------------------------------------
  # PUBLIC IPv4
  # ---------------------------------------------------------------------------

  elastic_ip_unassociated:
    recommendation_key: review_unused

  elastic_ip_on_stopped_instance:
    recommendation_key: review_unused

  public_ipv4_in_use_review:
    recommendation_key: review_network


  # ---------------------------------------------------------------------------
  # QUICKSight
  # ---------------------------------------------------------------------------

  quicksight_spice_capacity_pressure:
    recommendation_key: review_capacity

  quicksight_spice_dataset_review:
    recommendation_key: review_storage

  quicksight_stale_dashboard:
    recommendation_key: review_unused

  quicksight_stale_analysis:
    recommendation_key: review_unused

  quicksight_potentially_orphaned_dataset:
    recommendation_key: review_unused


  # ---------------------------------------------------------------------------
  # WAF
  # ---------------------------------------------------------------------------
  #
  # These should remain operational/security-focused unless the analyzer
  # explicitly marks them recommendation_eligible=True.
  #
  # No routes by default.