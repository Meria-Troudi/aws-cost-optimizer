
# =============================================================================
# AWS COST OPTIMIZER - RECOMMENDATION CATALOG
# =============================================================================

catalog:

  version: "6.0"

  purpose: cost_optimization_recommendations

  architecture_principles:

    analyzer_is_authority: true
    catalog_is_procedural: true
    recommendation_engine_is_thin: true
    llm_is_explanation_only: true

    catalog_does_not_collect_evidence: true
    catalog_does_not_calculate_savings: true
    catalog_does_not_reinterpret_billing: true
    catalog_does_not_discover_resources: true
    catalog_does_not_execute_changes: true


  # ===========================================================================
  # FINDING INPUT CONTRACT
  # ===========================================================================

  finding_input_contract:

    required_fields:
      - finding_id
      - finding_key
      - title
      - severity
      - recommendation_eligible
      - resource
      - evidence
      - financial_impact
      - confidence
      - limitations

    recommended_fields:
      - analyzer
      - observation_period
      - current_state
      - historical_state
      - attribution
      - source_finding_ids
      - affected_resources

    rules:

      analyzer_is_authority:
        - recommendation_engine_must_not_recompute_finding_eligibility
        - catalog_must_not_override_analyzer_decision
        - catalog_must_not_create_findings

      evidence:
        - recommendation_must_only_use_evidence_present_in_finding
        - missing_evidence_must_not_be_invented
        - unsupported_claims_must_not_be_added

      resource_state:
        - current_resource_must_be_distinguished_from_historical_resource
        - deleted_resources_must_not_receive_current_remediation_actions
        - resource_identity_must_not_be_reconstructed_from_guesswork

      attribution:
        - billing_attribution_must_come_from_finding
        - catalog_must_not_perform_billing_reconciliation
        - collection_plan_cost_must_not_be_presented_as_resource_cost


  # ===========================================================================
  # OUTPUT CONTRACT
  # ===========================================================================

  output_contract:

    required:
      - recommendation_id
      - recommendation_key
      - family
      - action
      - status
      - priority
      - title
      - recommendation_text
      - resource
      - finding
      - evidence
      - financial_impact
      - confidence
      - limitations

    optional:
      - affected_resources
      - historical_context
      - validation_steps
      - next_steps
      - aws_operations
      - llm_explanation


  # ===========================================================================
  # RECOMMENDATION STATUS
  # ===========================================================================

  recommendation_statuses:
    - actionable
    - requires_validation
    - informational
    - historical
    - insufficient_evidence


  status_policy:

    actionable:

      requirements:
        - finding_recommendation_eligible == true
        - required_evidence_present == true
        - current_resource_confirmed == true
        - no_blocking_limitation == true

      meaning:
        - recommendation_can_be_acted_on_after_normal_validation


    requires_validation:

      requirements:
        - finding_recommendation_eligible == true
        - evidence_supports_review
        - additional_human_validation_required

      meaning:
        - action_is_supported_but_change_requires_engineering_validation


    informational:

      requirements:
        - finding_exists
        - finding_is_not_directly_actionable

      examples:
        - service_level_cost_only
        - diagnostic_finding
        - architecture_observation
        - no_resource_specific_attribution


    historical:

      requirements:
        - finding_refers_to_historical_resource
        - current_resource_not_confirmed
        - or resource_deleted
        - or billing_period_does_not_match_current_resource

      meaning:
        - historical_context_only
        - must_not_recommend_current_resource_remediation


    insufficient_evidence:

      requirements:
        - required_evidence_missing
        - or evidence_conflicts
        - or resource_identity_not_confirmed

      meaning:
        - do_not_recommend_remediation


  # ===========================================================================
  # HISTORICAL RESOURCE POLICY
  # ===========================================================================

  historical_policy:

    purpose:
      - prevent_current_actions_from_being_generated_for_deleted_or_mismatched_resources

    historical_resource_rules:

      - historical_resource_must_be_explicitly_marked
      - current_resource_identity_must_be_verified_before_current_action
      - historical_cost_must_not_be_presented_as_current_cost
      - historical_cost_must_not_be_presented_as_current_savings
      - deleted_resource_must_not_receive_delete_recommendation
      - deleted_resource_must_not_receive_rightsizing_recommendation
      - deleted_resource_must_not_receive_current_configuration_recommendation
      - deleted_resource_must_not_receive_scheduling_recommendation
      - deleted_resource_must_not_receive_pricing_commitment_recommendation
      - historical_finding_may_be_informational
      - historical_finding_may_be_used_to_explain_billing_reconciliation


  # ===========================================================================
  # FINANCIAL BASIS
  # ===========================================================================

  financial_basis:

    allowed:
      - resource_attributed_cost
      - service_cost
      - collection_plan_cost
      - historical_cost
      - unavailable


    resource_attributed_cost:

      allowed_when:
        - attribution_scope == resource
        - resource_cost_attributed == true
        - claimable_resource_cost_is_numeric

      may_describe:
        - current_resource_cost
        - attributed_resource_cost

      must_not:
        - estimate_savings_without_explicit_evidence


    service_cost:

      may_describe:
        - service_level_cost
        - service_cost_context

      must_not_be_used_as:
        - current_resource_cost
        - resource_savings
        - exact_recommendation_savings


    collection_plan_cost:

      may_describe:
        - collection_scope_cost
        - investigation_scope_cost

      must_not_be_used_as:
        - current_resource_cost
        - resource_savings
        - savings_estimate


    historical_cost:

      may_describe:
        - historical_billing
        - historical_cost_context

      must_not_be_used_as:
        - current_resource_cost
        - current_resource_savings
        - guaranteed_savings


    unavailable:

      rules:
        - do_not_estimate_financial_impact
        - explicitly_state_financial_impact_unavailable


  # ===========================================================================
  # SAVINGS POLICY
  # ===========================================================================

  savings_policy:

    default: not_estimated

    allowed_only_when:
      - analyzer_or_pricing_evidence_explicitly_supports_estimate
      - calculation_inputs_are_present
      - estimate_is_traceable_to_evidence

    forbidden:
      - infer_savings_from_cost_alone
      - assume_100_percent_cost_removal
      - invent_replacement_price
      - invent_target_capacity
      - invent_discount
      - invent_commitment_term
      - invent_usage_reduction
      - convert_service_cost_to_resource_savings
      - convert_collection_plan_cost_to_resource_savings
      - convert_historical_cost_to_current_savings


  # ===========================================================================
  # AGGREGATION POLICY
  # ===========================================================================

  aggregation_policy:

    purpose:
      - prevent_shared_cost_from_being_counted_multiple_times

    rules:
      - retain_source_finding_ids
      - retain_stable_finding_ids
      - retain_affected_resources
      - do_not_sum_same_cost_across_multiple_findings_when_cost_is_shared
      - service_cost_must_not_be_multiplied_by_resource_count
      - collection_plan_cost_must_not_be_multiplied_by_resource_count
      - historical_cost_must_not_be_added_to_current_cost_without_explicit_period_logic


  # ===========================================================================
  # SAFETY POLICY
  # ===========================================================================

  safety_policy:

    destructive_actions:

      require:
        - resource_identity
        - current_resource_state
        - dependency_evidence_when_applicable
        - observed_state
        - human_confirmation

      must_not_assert:
        - safe_to_delete
        - safe_to_release
        - deletion_required
        - dependency_absent
        - business_requirement_absent
        - guaranteed_savings


    migration_actions:

      require:
        - current_configuration
        - observed_behavior
        - compatibility_evidence

      must_not_assert:
        - migration_is_risk_free
        - migration_is_required
        - compatibility_is_guaranteed


    pricing_actions:

      require:
        - eligible_usage
        - usage_pattern
        - pricing_eligibility

      must_not_assert:
        - commitment_is_profitable
        - exact_savings
        - exact_commitment_amount
        - exact_discount


    capacity_actions:

      require:
        - current_capacity
        - observed_demand

      must_not_assert:
        - exact_target_capacity
        - exact_replacement_instance
        - guaranteed_performance


    networking_actions:

      require:
        - topology_evidence
        - traffic_evidence
        - route_evidence_when_route_change_is_proposed

      must_not_assert:
        - replacement_path_is_safe
        - route_change_is_required
        - dependency_is_absent


  # ===========================================================================
  # PROCEDURE CONTRACT
  # ===========================================================================

  procedure_contract:

    required_fields:
      - objective
      - validation_steps
      - possible_actions

    optional_fields:
      - aws_operations
      - destructive
      - requires_human_confirmation

    rules:

      objective:
        - describe_purpose_of_action
        - must_not_claim_that_change_is_already_validated

      validation_steps:
        - ordered
        - evidence_driven
        - no_invented_requirements

      possible_actions:
        - must_be_conditional
        - must_not_claim_safety
        - must_not_claim_guaranteed_savings

      aws_operations:
        - operation_names_only
        - no_hardcoded_resource_ids
        - no_hardcoded_regions
        - no_hardcoded_target_values

      destructive:
        - destructive_changes_require_human_confirmation

      requires_human_confirmation:
        - true_for_destructive_changes
        - true_for_irreversible_changes
        - true_for_production_capacity_changes


# =============================================================================
# RECOMMENDATIONS
# =============================================================================

recommendations:


  # ===========================================================================
