      - current_resource_not_confirmed

    never_invent:
      - deletion_safety
      - replacement_architecture
      - savings

    procedure:

      objective:
        - determine_whether_the_network_attachment_is_still_required

      validation_steps:
        - verify_current_attachment
        - review_observed_traffic
        - inspect_dependencies
        - confirm_business_or_application_requirement

      possible_actions:
        - retain_attachment
        - consolidate_attachment
        - remove_attachment_after_validation

      aws_operations:
        - service_specific_describe_operation

      destructive: true
      requires_human_confirmation: true


  review_storage:

    family: storage
    action: review_storage_configuration
    priority: medium

    title_template: "Review Storage Configuration — {service}"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - storage_usage
      - performance
      - current_configuration

    never_invent:
      - target_storage_type
      - target_size
      - target_iops
      - savings

    procedure:

      objective:
        - determine_whether_storage_configuration_is_aligned_with_observed_usage

      validation_steps:
        - inspect_current_storage_configuration
        - review_storage_usage
        - review_performance
        - review_growth_behavior
        - compare_supported_storage_options

      possible_actions:
        - retain_storage_configuration
        - evaluate_storage_reduction
        - evaluate_storage_class_change
        - evaluate_performance_adjustment

      aws_operations:
        - service_specific_describe_operation

      destructive: false
      requires_human_confirmation: true


  review_backup:

    family: backup
    action: review_backup_retention
    priority: medium

    title_template: "Review Backup Retention — {service}"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - retention
      - backup_usage
      - recovery_requirements

    never_invent:
      - retention_target
      - compliance_requirement
      - savings

    procedure:

      objective:
        - determine_whether_backup_retention_exceeds_verified_recovery_requirements

      validation_steps:
        - inspect_current_retention
        - inspect_backup_storage_usage
        - inspect_backup_age_or_inventory
        - verify_recovery_requirement
        - verify_compliance_requirement_when_applicable

      possible_actions:
        - retain_backup_policy
        - evaluate_reduced_retention
        - review_old_backup_cleanup

      aws_operations:
        - service_specific_describe_operation

      destructive: true
      requires_human_confirmation: true


  review_pricing_commitment:

    family: commitment
    action: evaluate_commitment_pricing
    priority: medium

    title_template: "Evaluate Commitment Pricing — {service}"

    catalog_enabled: true
    recommendation_scope: account

    required_evidence:
      - eligible_usage
      - usage_stability
      - existing_commitments

    never_invent:
      - commitment_amount
      - commitment_term
      - discount
      - savings

    procedure:

      objective:
        - determine_whether_stable_eligible_usage_justifies_a_pricing_commitment_review

      validation_steps:
        - identify_eligible_usage
        - review_usage_stability
        - inspect_existing_commitments
        - compare_on_demand_and_commitment_options
        - verify_expected_usage_duration

      possible_actions:
        - remain_on_demand
        - evaluate_commitment
        - compare_multiple_commitment_options

      aws_operations:
        - service_specific_pricing_operation

      destructive: false
      requires_human_confirmation: true


  review_autoscaling:

    family: autoscaling
    action: evaluate_dynamic_capacity
    priority: medium

    title_template: "Evaluate Dynamic Capacity Scaling — {service}"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - demand_pattern
      - configured_capacity
      - autoscaling_state

    never_invent:
      - min_capacity
      - max_capacity
      - scaling_policy
      - savings

    procedure:

      objective:
        - determine_whether_capacity_should_respond_dynamically_to_observed_demand

      validation_steps:
        - inspect_current_capacity
        - inspect_demand_variability
        - inspect_existing_autoscaling
        - identify_scaling_constraints
        - determine_operational_capacity_bounds

      possible_actions:
        - retain_current_capacity_model
        - evaluate_autoscaling
        - configure_autoscaling_after_validation

      aws_operations:
        - service_specific_autoscaling_operation

      destructive: false
      requires_human_confirmation: true


  review_configuration:

    family: configuration
    action: review_configuration
    priority: low

    title_template: "Review {service} Configuration"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - configuration
      - observed_behavior

    never_invent:
      - required_configuration
      - compliance_requirement
      - savings

    procedure:

      objective:
        - determine_whether_current_configuration_should_be_changed

      validation_steps:
        - inspect_current_configuration
        - review_observed_behavior
        - identify_configuration_cost_driver
        - verify_operational_requirement

      possible_actions:
        - retain_configuration
        - evaluate_configuration_change

      aws_operations:
        - service_specific_describe_operation

      destructive: false
      requires_human_confirmation: true


  review_rightsizing:

    family: rightsizing
    action: review_rightsizing
    priority: low

    title_template: "Review {service} Rightsizing"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - observed_usage
      - performance

    never_invent:
      - replacement_instance_class
      - replacement_resource
      - target_capacity
      - savings
      - workload_requirements

    procedure:

      objective:
        - determine_whether_observed_utilization_justifies_a_capacity_change

      validation_steps:
        - review_observed_utilization
        - verify_observation_period_coverage
        - confirm_workload_requirements
        - identify_candidate_target_capacity

      possible_actions:
        - retain_current_capacity
        - evaluate_capacity_change

      aws_operations:
        - service_specific_describe_operation

      destructive: false
      requires_human_confirmation: true


  review_billing_mode:

    family: pricing
    action: review_billing_mode
    priority: low

    title_template: "Review {service} Billing Mode"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - billing_mode
      - demand_pattern

    never_invent:
      - savings
      - commitment_terms
      - discounts
      - workload_requirements

    procedure:

      objective:
        - determine_whether_current_billing_mode_matches_observed_demand

      validation_steps:
        - review_current_billing_mode
        - review_observed_demand_pattern
        - compare_pricing_modes_against_observed_usage
        - verify_operational_requirements

      possible_actions:
        - retain_current_billing_mode
        - evaluate_billing_mode_change

      aws_operations:
        - service_specific_describe_operation

      destructive: false
      requires_human_confirmation: true


  review_global_replication:

    family: resilience
    action: review_global_replication
    priority: low

    title_template: "Review {service} Global Replication"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - replica_regions
      - regional_usage

    never_invent:
      - savings
      - target_region
      - replication_requirements
      - business_requirements

    procedure:

      objective:
        - determine_whether_current_replication_footprint_matches_observed_regional_usage

      validation_steps:
        - review_current_replica_regions
        - review_regional_usage
        - verify_resilience_requirements
        - verify_compliance_requirements

      possible_actions:
        - retain_current_replication
        - evaluate_replication_change

      aws_operations:
        - service_specific_describe_operation

      destructive: false
      requires_human_confirmation: true


  review_capacity:

    family: capacity
