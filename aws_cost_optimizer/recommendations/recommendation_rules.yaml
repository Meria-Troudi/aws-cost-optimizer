  # ===========================================================================

  rds_delete_unused_database:

    family: unused_resource
    action: review_database_retirement
    priority: high

    title_template: "Review Retirement of Inactive RDS Database — Amazon RDS"

    catalog_enabled: true
    recommendation_scope: resource

    required_evidence:
      - resource_identity
      - observed_usage
      - resource_state
      - current_configuration

    forbidden_if:
      - historical_resource_only
      - current_resource_not_confirmed

    never_invent:
      - business_requirement
      - dependency
      - recovery_requirement
      - deletion_safety
      - savings

    procedure:

      objective:
        - determine_whether_the_current_RDS_instance_is_still_required

      validation_steps:
        - verify_current_instance_identity
        - verify_current_instance_status
        - review_observed_cpu_connections_and_io
        - review_recent_activity
        - review_lifecycle_activity
        - verify_read_replica_relationships
        - verify_dependency_and_network_requirements
        - review_backup_and_snapshot_context
        - confirm_business_owner_or_application_requirement

      possible_actions:
        - retain_database
        - stop_database_when_supported_and_validated
        - retire_database_after_validation

      aws_operations:
        - describe-db-instances
        - describe-db-snapshots
        - describe-db-instance-automated-backups
        - describe-db-clusters

