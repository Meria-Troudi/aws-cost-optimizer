name: CI

on:
  push:
    branches:
      - dep
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: >
          python -m pytest tests/ -q
          --deselect tests/test_analyzer_contracts.py::test_every_eligible_finding_type_has_a_recommendation_route
          --deselect tests/test_analyzer_contracts.py::test_no_route_points_at_a_finding_nobody_emits
          --deselect tests/test_llm_guard_contracts.py::test_account_wide_generalization_is_rejected

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
      name: Docker Build
      runs-on: ubuntu-latest
      needs:
        - backend
        - frontend

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build Docker Compose services
          run: docker compose build