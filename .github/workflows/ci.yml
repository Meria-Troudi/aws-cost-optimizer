
name: CI-CD

on:
  push:
    branches:
      - dep
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          python -m pytest tests/ -q \
            --deselect tests/test_analyzer_contracts.py::test_every_eligible_finding_type_has_a_recommendation_route \
            --deselect tests/test_analyzer_contracts.py::test_no_route_points_at_a_finding_nobody_emits \
            --deselect tests/test_llm_guard_contracts.py::test_account_wide_generalization_is_rejected

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Validate Docker Compose Build
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose services
        run: docker compose build

  publish-and-update:
    name: Publish Images and Update Kubernetes Manifests
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
      - docker-build

    # Never publish images or modify manifests for pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dep'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dep
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            meriatr/fin-backend:latest
            meriatr/fin-backend:git-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            meriatr/fin-frontend:latest
            meriatr/fin-frontend:git-${{ github.sha }}

      - name: Update Kubernetes image tags
        env:
          IMAGE_TAG: git-${{ github.sha }}
        run: |
          sed -i "s#image: meriatr/fin-backend:.*#image: meriatr/fin-backend:${IMAGE_TAG}#" k8s/backend.yaml
          sed -i "s#image: meriatr/fin-frontend:.*#image: meriatr/fin-frontend:${IMAGE_TAG}#" k8s/frontend.yaml

          echo "Updated Kubernetes manifests:"
          grep "image:" k8s/backend.yaml
          grep "image:" k8s/frontend.yaml

      - name: Commit and push Kubernetes manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/backend.yaml k8s/frontend.yaml

          if git diff --cached --quiet; then
            echo "No Kubernetes manifest changes to commit."
          else
            git commit -m "chore(k8s): deploy ${GITHUB_SHA} [skip ci]"
            git push origin HEAD:dep
          fi
