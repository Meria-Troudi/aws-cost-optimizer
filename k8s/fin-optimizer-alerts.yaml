
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fin-optimizer-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: fin-optimizer.availability
      rules:
        - alert: FinOptimizerBackendDown
          expr: |
            up{namespace="fin-optimizer", service="backend"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Fin Optimizer backend is down"
            description: "Prometheus cannot scrape the backend metrics endpoint for 2 minutes."

        - alert: FinOptimizerPodNotReady
          expr: |
            kube_pod_status_ready{
              namespace="fin-optimizer",
              condition="true"
            } == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fin Optimizer pod is not ready"
            description: "A Fin Optimizer pod has been unready for 5 minutes."

        - alert: FinOptimizerContainerRestarting
          expr: |
            increase(kube_pod_container_status_restarts_total{
              namespace="fin-optimizer"
            }[10m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Fin Optimizer container is restarting"
            description: "A container has restarted more than twice in 10 minutes."

    - name: fin-optimizer.application
      rules:
        - alert: FinOptimizerHighRequestLatency
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (
                rate(http_request_duration_seconds_bucket{
                  namespace="fin-optimizer",
                  job="backend"
                }[5m])
              )
            ) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fin Optimizer backend latency is high"
            description: "The estimated 95th-percentile request latency exceeds 2 seconds for 5 minutes."
